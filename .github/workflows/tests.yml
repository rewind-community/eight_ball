name: Tests

on: pull_request

jobs:
  rpsec:
    name: rspec tests
    strategy:
      fail-fast: false
      matrix:
        # Single-value matrix kept so the job-name suffix `(3.4)` matches branch-protection required-check names.
        ruby: ['3.4']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde # v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run rspec tests
        env:
          RAILS_ENV: test
        run: bundle exec rspec
